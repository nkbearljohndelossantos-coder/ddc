version: '3.8'

services:
  postgres:
    image: postgres:16.3-alpine
    container_name: nkb-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-nkb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nkb_development_secret_password_change_in_prod}
      POSTGRES_DB: ${DB_NAME:-nkb_scanner_db}
    volumes:
      - pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nkb_user} -d ${DB_NAME:-nkb_scanner_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nkb-dev-net

  redis:
    image: redis:7.2.5-alpine
    container_name: nkb-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      sh -c 'redis-server --requirepass "${REDIS_PASSWORD:-nkb_redis_dev_secret_change_in_prod}" --appendonly yes'
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nkb_redis_dev_secret_change_in_prod}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nkb-dev-net

  storage:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: nkb-minio-dev
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nkb_minio_admin_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nkb_minio_secret_key_change_in_prod}
    volumes:
      - storage-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nkb-dev-net

volumes:
  pg-dev-data:
  redis-dev-data:
  storage-dev-data:

networks:
  nkb-dev-net:
    driver: bridge
